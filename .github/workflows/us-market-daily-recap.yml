name: US market daily recap

on:
  workflow_dispatch:
    inputs:
      report_date_bjt:
        description: 'Beijing report date; leave blank for today'
        required: false
        type: string
  schedule:
    # GitHub's default cron timezone is UTC: 21:03 UTC = 05:03 Beijing time.
    # This is the GitHub-hosted primary attempt. The 07:03 BJT Codex/external
    # dispatcher remains a later compensation path; delivery_state.py makes
    # the triggers idempotent.
    - cron: '3 21 * * *'

concurrency:
  group: us-market-daily-recap
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  generate-and-notify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CODEX_TASK_DIR: '${{ github.workspace }}'
      RECAP_OUTPUT_ROOT: '${{ github.workspace }}\outputs'
      US_MARKET_SKILL_DIR: '${{ github.workspace }}\skill'
      US_MARKET_RECAP_COMMAND: '${{ github.workspace }}\scripts\generate_daily_recap.py'
      GH_TOKEN: ${{ github.token }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Checkout recap pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib requests python-docx

      - name: Verify tracked Skill bundle
        shell: powershell
        run: |
          $required = @(
            "$env:CODEX_TASK_DIR\skill\SKILL.md",
            "$env:CODEX_TASK_DIR\skill\references\company_expectation_and_claims.md",
            "$env:CODEX_TASK_DIR\skill\references\index_inclusion_and_options.md",
            "$env:CODEX_TASK_DIR\skill\references\social_heat_integration.md",
            "$env:CODEX_TASK_DIR\skill\references\style_learnings_from_20260729_pdfs.md",
            "$env:CODEX_TASK_DIR\skill\scripts\rotation_engine.py",
            "$env:CODEX_TASK_DIR\skill\scripts\option_chain_collect.py",
            "$env:CODEX_TASK_DIR\skill\scripts\index_inclusion_watch.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Tracked Skill bundle is incomplete: $path"
            }
          }
          $env:SKILL_HASH_TARGET = $env:US_MARKET_SKILL_DIR
          $bundleHash = python -c "import os; from pathlib import Path; from scripts.generate_daily_recap import skill_bundle_hash; print(skill_bundle_hash(Path(os.environ['SKILL_HASH_TARGET'])))"
          Write-Host "skill_dir=$env:US_MARKET_SKILL_DIR"
          Write-Host "skill_bundle_sha256=$bundleHash"

      - name: Log scheduler context
        shell: powershell
        run: |
          $utc = [DateTime]::UtcNow
          $zone = [TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $bjt = [TimeZoneInfo]::ConvertTimeFromUtc($utc, $zone)
          Write-Host "event=${{ github.event_name }}"
          Write-Host "run_id=${{ github.run_id }} run_number=${{ github.run_number }}"
          Write-Host "head_sha=${{ github.sha }}"
          Write-Host "runner_started_utc=$($utc.ToString('o'))"
          Write-Host "runner_started_bjt=$($bjt.ToString('o'))"
          Write-Host "schedule_expression=3 21 * * * (05:03 BJT GitHub primary target)"

      - name: Run local skill-compatible recap pipeline and notify Feishu
        id: run-recap
        shell: powershell
        run: |
          $date = '${{ inputs.report_date_bjt }}'
          $args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:CODEX_TASK_DIR\scripts\run_daily_recap.ps1")
          if ($date) { $args += @('-ReportDateBjt', $date) }
          & powershell.exe @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content "$env:CODEX_TASK_DIR\outputs\latest_daily_recap.json" -Raw | ConvertFrom-Json
          "report_path=$($manifest.report_path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "report_name=$($manifest.report_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload the Word report to the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run-recap.outputs.report_name }}
          path: ${{ steps.run-recap.outputs.report_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload recap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-audit-${{ github.run_id }}
          path: |
            ${{ github.workspace }}\outputs\latest_daily_recap.json
            ${{ github.workspace }}\outputs\**\generation_manifest.json
          if-no-files-found: warn
          retention-days: 14

  failure-alert:
    needs: generate-and-notify
    if: ${{ failure() && needs.generate-and-notify.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Checkout alert script
        uses: actions/checkout@v4

      - name: Download failure audit
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: recap-audit-${{ github.run_id }}
          path: failure-audit

      - name: Send failure alert to Feishu
        shell: bash
        run: |
          audit="failure-audit/latest_daily_recap.json"
          if [ -f "$audit" ]; then
            phase="$(jq -r '.failure_phase // "unknown"' "$audit")"
            reason="$(jq -r '.error // "main workflow failed without an audit reason"' "$audit")"
            report_date="$(jq -r '.report_date_bjt // "unknown"' "$audit")"
          else
            phase="workflow"
            reason="Main report job failed before its audit artifact was available"
            report_date="unknown"
          fi
          python3 scripts/send_failure_alert.py \
            --phase "$phase" \
            --reason "$reason" \
            --report-date-bjt "$report_date" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
